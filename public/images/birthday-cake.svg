<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Cake Gradients -->
    <linearGradient id="cakePlateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE2D8" />
    </linearGradient>
    <linearGradient id="cakeBaseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCECEF" />
      <stop offset="50%" stop-color="#FFF5F7" />
      <stop offset="100%" stop-color="#F8DEE5" />
    </linearGradient>
    <linearGradient id="frostingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5C6D0" />
      <stop offset="100%" stop-color="#E896A9" />
    </linearGradient>
    <linearGradient id="strawberryGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FF597B" />
      <stop offset="100%" stop-color="#D82148" />
    </linearGradient>
    <linearGradient id="candleGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8C987" />
      <stop offset="100%" stop-color="#FDF1D6" />
    </linearGradient>
    <linearGradient id="candleGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DCD6F7" />
      <stop offset="100%" stop-color="#F0EDFD" />
    </linearGradient>
    <linearGradient id="candleGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C77D91" />
      <stop offset="100%" stop-color="#F2C2CE" />
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE682" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FFA826" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF5900" stop-opacity="0" />
    </radialGradient>
    <filter id="cakeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#493447" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Soft Pedestal Stand -->
  <g id="cakeStand" filter="url(#cakeShadow)">
    <ellipse cx="250" cy="420" rx="160" ry="24" fill="#E8D5C8" opacity="0.6" />
    <!-- Stand Base -->
    <path d="M220 390 L210 440 L290 440 L280 390 Z" fill="url(#cakePlateGrad)" stroke="#E8C987" stroke-width="1.5" />
    <!-- Stand Platter -->
    <ellipse cx="250" cy="390" rx="190" ry="22" fill="url(#cakePlateGrad)" stroke="#E8C987" stroke-width="2" />
    <!-- Platter Rim Lace dots -->
    <ellipse cx="250" cy="386" rx="180" ry="18" fill="none" stroke="#F5C6D0" stroke-width="2" stroke-dasharray="6 6" />
  </g>

  <!-- Cake Bottom Layer -->
  <g id="bottomLayer">
    <path d="M100 310 C100 310 100 380 100 380 C100 405 400 405 400 380 L400 310 Z" fill="url(#cakeBaseGrad)" stroke="#F5C6D0" stroke-width="1.5" />
    <!-- Bottom layer top ellipse -->
    <ellipse cx="250" cy="310" rx="150" ry="24" fill="#FFF2F4" stroke="#F5C6D0" stroke-width="1.5" />
    <!-- Dripping Pink Frosting on Bottom Tier -->
    <path d="M100 312 C115 335 125 315 140 338 C155 350 165 320 185 342 C205 355 215 322 235 344 C255 352 265 320 285 340 C305 350 315 324 335 344 C355 352 368 318 385 336 C392 325 398 318 400 312 C400 312 360 326 250 326 C140 326 100 312 100 312 Z" fill="url(#frostingGrad)" />
    <!-- Cute edible pearl beads along bottom edge -->
    <g fill="#FFF8F0" stroke="#E8C987" stroke-width="1">
      <circle cx="120" cy="378" r="4" /><circle cx="150" cy="384" r="4" />
      <circle cx="185" cy="389" r="4" /><circle cx="220" cy="392" r="4" />
      <circle cx="250" cy="393" r="4" /><circle cx="280" cy="392" r="4" />
      <circle cx="315" cy="389" r="4" /><circle cx="350" cy="384" r="4" />
      <circle cx="380" cy="378" r="4" />
    </g>
  </g>

  <!-- Cake Top Layer -->
  <g id="topLayer">
    <path d="M145 220 C145 220 145 290 145 290 C145 310 355 310 355 290 L355 220 Z" fill="url(#cakeBaseGrad)" stroke="#F5C6D0" stroke-width="1.5" />
    <!-- Top layer surface -->
    <ellipse cx="250" cy="220" rx="105" ry="18" fill="#FFF2F4" stroke="#F5C6D0" stroke-width="1.5" />
    <!-- Dripping Frosting on Top Tier -->
    <path d="M145 222 C160 242 170 228 185 245 C200 255 210 230 228 250 C245 258 258 232 272 250 C288 256 300 232 315 248 C330 252 342 228 355 222 C355 222 320 234 250 234 C180 234 145 222 145 222 Z" fill="url(#frostingGrad)" />
  </g>

  <!-- Cake Topping Strawberries & Star Sprinkles -->
  <g id="strawberries">
    <!-- Strawberry 1 (Center Left) -->
    <g transform="translate(205, 202) rotate(-8)">
      <path d="M0 0 C-10 0 -16 10 -12 20 C-8 28 0 32 0 32 C0 32 8 28 12 20 C16 10 10 0 0 0 Z" fill="url(#strawberryGrad)" />
      <!-- Strawberry leaves -->
      <path d="M-6 -2 C-1 -4 0 0 0 0 C0 0 1 -4 6 -2 C4 -6 0 -7 0 -7 C0 -7 -4 -6 -6 -2 Z" fill="#698269" />
      <!-- Seeds -->
      <circle cx="-3" cy="8" r="0.8" fill="#FFEDB0" /><circle cx="3" cy="9" r="0.8" fill="#FFEDB0" />
      <circle cx="-1" cy="15" r="0.8" fill="#FFEDB0" /><circle cx="4" cy="18" r="0.8" fill="#FFEDB0" />
    </g>
    <!-- Strawberry 2 (Center Right) -->
    <g transform="translate(295, 204) rotate(10)">
      <path d="M0 0 C-10 0 -16 10 -12 20 C-8 28 0 32 0 32 C0 32 8 28 12 20 C16 10 10 0 0 0 Z" fill="url(#strawberryGrad)" />
      <path d="M-6 -2 C-1 -4 0 0 0 0 C0 0 1 -4 6 -2 C4 -6 0 -7 0 -7 C0 -7 -4 -6 -6 -2 Z" fill="#698269" />
      <circle cx="-3" cy="8" r="0.8" fill="#FFEDB0" /><circle cx="3" cy="9" r="0.8" fill="#FFEDB0" />
      <circle cx="-1" cy="15" r="0.8" fill="#FFEDB0" />
    </g>
    <!-- Little cream dollops -->
    <ellipse cx="165" cy="225" rx="8" ry="6" fill="#FFFFFF" />
    <ellipse cx="335" cy="225" rx="8" ry="6" fill="#FFFFFF" />
    <ellipse cx="250" cy="228" rx="9" ry="6" fill="#FFFFFF" />

    <!-- Golden Star sprinkles -->
    <path d="M180 236 L182 240 L186 241 L182 242 L180 246 L178 242 L174 241 L178 240 Z" fill="#E8C987" />
    <path d="M315 238 L317 242 L321 243 L317 244 L315 248 L313 244 L309 243 L313 242 Z" fill="#E8C987" />
    <path d="M235 295 L237 298 L240 299 L237 300 L235 303 L233 300 L230 299 L233 298 Z" fill="#E8C987" />
    <path d="M275 297 L277 300 L280 301 L277 302 L275 305 L273 302 L270 301 L273 300 Z" fill="#E8C987" />
  </g>

  <!-- Candles -->
  <g id="candles">
    <!-- Candle 1 (Left - Lavender) -->
    <g transform="translate(195, 125)">
      <rect x="-4" y="0" width="8" height="60" rx="3" fill="url(#candleGrad2)" stroke="#B3A9E8" stroke-width="1" />
      <!-- Spiraling stripe -->
      <path d="M-4 12 L4 20 M-4 28 L4 36 M-4 44 L4 52" stroke="#FFF8F0" stroke-width="1.8" />
      <!-- Wick -->
      <line x1="0" y1="0" x2="0" y2="-8" stroke="#493447" stroke-width="1.5" />
      <!-- Flame Glow -->
      <circle class="candle-flame-glow" cx="0" cy="-16" r="18" fill="url(#flameGlow)" />
      <!-- Flame -->
      <path class="candle-flame" d="M0 -26 C-5 -19 -4 -12 0 -9 C4 -12 5 -19 0 -26 Z" fill="#FFC93C" />
      <ellipse class="candle-flame-core" cx="0" cy="-14" rx="2" ry="4" fill="#FFFFFF" />
    </g>

    <!-- Candle 2 (Center - Golden/Rose, taller) -->
    <g transform="translate(250, 105)">
      <rect x="-5" y="0" width="10" height="78" rx="3" fill="url(#candleGrad1)" stroke="#CFA451" stroke-width="1" />
      <!-- Spiraling stripe -->
      <path d="M-5 14 L5 24 M-5 32 L5 42 M-5 50 L5 60 M-5 68 L5 78" stroke="#FFF8F0" stroke-width="2" />
      <!-- Wick -->
      <line x1="0" y1="0" x2="0" y2="-9" stroke="#493447" stroke-width="1.5" />
      <!-- Flame Glow -->
      <circle class="candle-flame-glow" cx="0" cy="-18" r="22" fill="url(#flameGlow)" />
      <!-- Flame -->
      <path class="candle-flame" d="M0 -30 C-6 -22 -5 -14 0 -10 C5 -14 6 -22 0 -30 Z" fill="#FFB703" />
      <ellipse class="candle-flame-core" cx="0" cy="-16" rx="2.5" ry="5" fill="#FFFFFF" />
    </g>

    <!-- Candle 3 (Right - Rose Pink) -->
    <g transform="translate(305, 125)">
      <rect x="-4" y="0" width="8" height="60" rx="3" fill="url(#candleGrad3)" stroke="#A85C70" stroke-width="1" />
      <path d="M-4 12 L4 20 M-4 28 L4 36 M-4 44 L4 52" stroke="#FFF8F0" stroke-width="1.8" />
      <line x1="0" y1="0" x2="0" y2="-8" stroke="#493447" stroke-width="1.5" />
      <circle class="candle-flame-glow" cx="0" cy="-16" r="18" fill="url(#flameGlow)" />
      <path class="candle-flame" d="M0 -26 C-5 -19 -4 -12 0 -9 C4 -12 5 -19 0 -26 Z" fill="#FFC93C" />
      <ellipse class="candle-flame-core" cx="0" cy="-14" rx="2" ry="4" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Fairy Light Sparkles around the cake -->
  <g opacity="0.9">
    <circle cx="95" cy="280" r="3" fill="#E8C987" />
    <circle cx="120" cy="180" r="2.5" fill="#FFEAA7" />
    <circle cx="380" cy="170" r="3" fill="#FFEAA7" />
    <circle cx="410" cy="270" r="2.5" fill="#E8C987" />
    <path d="M70 330 Q80 340 70 350" stroke="#F5C6D0" stroke-width="1.5" stroke-dasharray="2 3" fill="none" />
    <path d="M430 330 Q420 340 430 350" stroke="#F5C6D0" stroke-width="1.5" stroke-dasharray="2 3" fill="none" />
  </g>
</svg>
