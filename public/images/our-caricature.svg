<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="paperGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#FFF2E7" />
      <stop offset="100%" stop-color="#F7DFD4" />
    </radialGradient>
    <radialGradient id="haloLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFEED9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFF8F0" stop-opacity="0" />
    </radialGradient>

    <!-- Character Gradients -->
    <linearGradient id="sweaterBoy" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#5C3D5A" />
      <stop offset="50%" stop-color="#493447" />
      <stop offset="100%" stop-color="#362235" />
    </linearGradient>
    <linearGradient id="sweaterGirl" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#E896A9" />
      <stop offset="50%" stop-color="#C77D91" />
      <stop offset="100%" stop-color="#A85C70" />
    </linearGradient>
    <linearGradient id="hairBoy" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#5C3A21" />
      <stop offset="50%" stop-color="#422817" />
      <stop offset="100%" stop-color="#2E1A0E" />
    </linearGradient>
    <linearGradient id="hairGirl" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3B2820" />
      <stop offset="50%" stop-color="#281A14" />
      <stop offset="100%" stop-color="#190F0B" />
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A9E" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FF8A9E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCE5A4" />
      <stop offset="50%" stop-color="#E8C987" />
      <stop offset="100%" stop-color="#CFA451" />
    </linearGradient>
    <linearGradient id="envelopeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF2F4" />
      <stop offset="100%" stop-color="#F5C6D0" />
    </linearGradient>

    <!-- Filters for watercolor/story-book hand-drawn feel -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#493447" flood-opacity="0.12" />
    </filter>
    <filter id="gentleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Decorative Outer Badge -->
  <g filter="url(#softShadow)">
    <circle cx="300" cy="300" r="265" fill="url(#paperGlow)" stroke="#F5C6D0" stroke-width="4" />
    <circle cx="300" cy="300" r="255" fill="none" stroke="#E8C987" stroke-width="1.5" stroke-dasharray="6 5" />
    <circle cx="300" cy="270" r="210" fill="url(#haloLight)" />
  </g>

  <!-- Background Decorative Flora and Stars -->
  <g opacity="0.85">
    <!-- Golden Constellation Stars & Sparkles -->
    <path d="M120 160 L124 172 L136 176 L124 180 L120 192 L116 180 L104 176 L116 172 Z" fill="url(#goldGradient)" />
    <path d="M470 140 L473 150 L483 153 L473 156 L470 166 L467 156 L457 153 L467 150 Z" fill="url(#goldGradient)" />
    <path d="M170 100 L172 107 L179 109 L172 111 L170 118 L168 111 L161 109 L168 107 Z" fill="url(#goldGradient)" />
    <path d="M420 85 L422 91 L428 93 L422 95 L420 101 L418 95 L412 93 L418 91 Z" fill="url(#goldGradient)" />
    <circle cx="140" cy="120" r="2.5" fill="#E8C987" />
    <circle cx="450" cy="100" r="3" fill="#E8C987" />
    <circle cx="100" cy="230" r="2" fill="#E8C987" />
    <circle cx="500" cy="220" r="2.5" fill="#E8C987" />

    <!-- Floating Sweet Hearts -->
    <path d="M210 130 C204 122 192 124 192 133 C192 144 210 155 210 155 C210 155 228 144 228 133 C228 124 216 122 210 130 Z" fill="#F5C6D0" opacity="0.85" />
    <path d="M380 115 C375 108 365 110 365 118 C365 127 380 137 380 137 C380 137 395 127 395 118 C395 110 385 108 380 115 Z" fill="#E896A9" opacity="0.75" />
    <path d="M300 95 C295 87 283 89 283 98 C283 110 300 120 300 120 C300 120 317 110 317 98 C317 89 305 87 300 95 Z" fill="#C77D91" opacity="0.9" filter="url(#gentleGlow)" />
  </g>

  <!-- Cozy Wooden Bench -->
  <g id="bench">
    <!-- Bench back slat -->
    <path d="M110 375 C110 370 490 370 490 375 L490 390 C490 395 110 395 110 390 Z" fill="#7A4E32" />
    <path d="M120 378 C120 374 480 374 480 378 L480 384 C480 388 120 388 120 384 Z" fill="#916142" opacity="0.6" />
    <!-- Bench seat -->
    <path d="M95 440 C95 435 505 435 505 440 L500 458 C500 462 100 462 100 458 Z" fill="#5F3B25" />
    <path d="M102 443 C102 439 498 439 498 443 L495 449 C495 453 105 453 105 449 Z" fill="#805336" />
    <!-- Bench legs -->
    <rect x="130" y="458" width="16" height="52" rx="4" fill="#3D2517" />
    <rect x="454" y="458" width="16" height="52" rx="4" fill="#3D2517" />
  </g>

  <!-- ==================== BOYFRIEND (LEFT/CENTER) ==================== -->
  <g id="boyfriend">
    <!-- Boy Body / Plum Sweater -->
    <path d="M185 360 C185 320 220 310 260 310 C290 310 315 325 320 360 L330 460 C330 465 175 465 175 460 Z" fill="url(#sweaterBoy)" />
    <!-- Knit Cable Texture Accents -->
    <path d="M225 345 Q228 395 225 445" stroke="#362235" stroke-width="2.5" stroke-dasharray="4 6" fill="none" opacity="0.4" />
    <path d="M255 340 Q258 395 255 450" stroke="#362235" stroke-width="2.5" stroke-dasharray="4 6" fill="none" opacity="0.4" />
    <!-- Sweater Turtleneck Collar -->
    <path d="M225 315 C225 305 285 305 285 315 L280 332 C280 337 230 337 230 332 Z" fill="#5C3D5A" stroke="#362235" stroke-width="1.5" />

    <!-- Boy Left Arm (leaning comfortably on bench) -->
    <path d="M185 350 C165 375 160 410 170 445 C175 455 190 450 195 440 C185 410 195 380 205 365 Z" fill="#493447" />

    <!-- Boy Right Arm (extended toward center holding envelope) -->
    <path d="M295 355 C305 380 315 405 320 425 C320 435 305 440 295 435 C285 415 280 395 275 375 Z" fill="#493447" />

    <!-- Boy Neck -->
    <path d="M242 285 L268 285 L268 315 L242 315 Z" fill="#F7D3BC" />

    <!-- Boy Head / Face -->
    <ellipse cx="255" cy="255" rx="42" ry="48" fill="#FDE2D0" />
    <!-- Ears -->
    <ellipse cx="212" cy="258" rx="8" ry="12" fill="#F7D3BC" />
    <ellipse cx="298" cy="258" rx="7" ry="11" fill="#F7D3BC" opacity="0.8" />

    <!-- Boy Hair (Soft wavy brown hair with lovely fringe) -->
    <path d="M210 245 C205 210 220 185 258 185 C295 185 312 210 308 245 C300 230 290 225 275 228 C260 230 250 225 240 228 C225 232 218 238 210 245 Z" fill="url(#hairBoy)" />
    <!-- Fluffy hair locks & texture -->
    <path d="M225 200 C235 188 260 188 275 194 C268 198 252 196 242 205 Z" fill="#6A462B" />
    <path d="M270 190 C285 190 300 200 305 212 C298 208 288 205 280 208 Z" fill="#6A462B" />
    <path d="M218 225 C222 235 235 235 242 230 C232 228 225 224 218 225 Z" fill="#422817" />
    <path d="M245 228 C255 238 270 236 278 228 C268 230 258 227 245 228 Z" fill="#422817" />

    <!-- Boy Facial Features -->
    <!-- Eyebrows (Gentle, warm arch) -->
    <path d="M232 238 Q242 234 250 238" stroke="#3D2517" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M266 238 Q274 234 282 238" stroke="#3D2517" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Eyes (Warm happy smiling crescents) -->
    <path d="M233 252 C236 247 246 247 249 252" stroke="#2E1A0E" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <circle cx="241" cy="250" r="1" fill="#FFFFFF" />
    <path d="M267 252 C270 247 280 247 283 252" stroke="#2E1A0E" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <circle cx="275" cy="250" r="1" fill="#FFFFFF" />
    <!-- Sweet Rosy Blush -->
    <ellipse cx="233" cy="264" rx="11" ry="6" fill="url(#blush)" />
    <ellipse cx="283" cy="264" rx="11" ry="6" fill="url(#blush)" />
    <!-- Cute Nose -->
    <path d="M256 257 Q258 263 254 265" stroke="#DDA88E" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Warm Smiling Mouth -->
    <path d="M248 274 Q257 282 266 274" stroke="#A84C58" stroke-width="2.6" stroke-linecap="round" fill="none" />
  </g>

  <!-- ==================== GIRLFRIEND (RIGHT/CENTER) ==================== -->
  <g id="girlfriend">
    <!-- Girl Back Hair (flows over shoulders) -->
    <path d="M315 255 C310 230 325 190 365 190 C405 190 425 230 420 275 C420 330 395 380 395 395 C380 375 385 330 380 305 Z" fill="url(#hairGirl)" />

    <!-- Girl Body / Dusty Rose Cardigan & Ivory Top -->
    <path d="M305 365 C315 325 345 315 380 320 C410 325 435 345 440 385 L445 460 C445 465 295 465 295 460 Z" fill="url(#sweaterGirl)" />
    <!-- Inner Ivory Blouse -->
    <path d="M345 320 L375 322 L368 365 L348 365 Z" fill="#FFF8F0" />
    <line x1="358" y1="330" x2="358" y2="360" stroke="#F5C6D0" stroke-width="1.5" stroke-dasharray="2 3" />
    <!-- Cardigan Lapels -->
    <path d="M338 322 Q348 360 348 405" stroke="#A85C70" stroke-width="2" fill="none" />
    <path d="M382 324 Q372 360 370 405" stroke="#A85C70" stroke-width="2" fill="none" />

    <!-- Girl Left Arm (leaning affectionately into center) -->
    <path d="M315 365 C308 390 305 415 305 435 C312 440 325 435 328 425 C330 405 338 385 345 365 Z" fill="#C77D91" />

    <!-- Girl Right Arm (resting gently beside her) -->
    <path d="M425 365 C438 390 442 415 438 445 C432 452 420 450 415 440 C418 415 412 390 405 370 Z" fill="#C77D91" />

    <!-- Girl Neck (tilted gently toward boy) -->
    <path d="M348 290 L372 293 L370 322 L345 320 Z" fill="#F7D3BC" />

    <!-- Girl Head / Face (tilted playfully towards boyfriend) -->
    <g transform="rotate(-6 358 262)">
      <ellipse cx="358" cy="262" rx="39" ry="45" fill="#FDE2D0" />
      <!-- Ear -->
      <ellipse cx="396" cy="264" rx="6" ry="10" fill="#F7D3BC" />
      <circle cx="397" cy="267" r="1.5" fill="#E8C987" /> <!-- tiny golden earring -->

      <!-- Girl Front Hair / Soft Bangs & Tendrils -->
      <path d="M318 245 C320 215 335 192 368 192 C402 192 415 215 415 245 C408 232 395 226 380 230 C365 232 355 225 342 228 C330 232 322 238 318 245 Z" fill="url(#hairGirl)" />
      <!-- Soft face framing bangs -->
      <path d="M330 228 C340 240 355 238 360 230 C348 226 338 224 330 228 Z" fill="#281A14" />
      <path d="M362 230 C372 240 388 238 395 230 C385 226 374 225 362 230 Z" fill="#281A14" />

      <!-- Flower Hairpin (Dusty Rose & Gold) -->
      <circle cx="392" cy="225" r="7" fill="#E896A9" />
      <circle cx="392" cy="225" r="3" fill="#E8C987" />
      <circle cx="386" cy="223" r="4" fill="#F5C6D0" />
      <circle cx="397" cy="221" r="4" fill="#F5C6D0" />

      <!-- Girl Facial Features -->
      <!-- Eyebrows (Sweet arched) -->
      <path d="M336 244 Q344 240 352 243" stroke="#281A14" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <path d="M366 243 Q374 240 382 244" stroke="#281A14" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <!-- Eyes (Happy smiling closed eyes with long delicate lashes) -->
      <path d="M338 256 C341 251 349 251 352 256" stroke="#190F0B" stroke-width="2.6" stroke-linecap="round" fill="none" />
      <path d="M352 255 L356 253" stroke="#190F0B" stroke-width="1.8" stroke-linecap="round" /> <!-- eyelash -->
      <path d="M368 256 C371 251 379 251 382 256" stroke="#190F0B" stroke-width="2.6" stroke-linecap="round" fill="none" />
      <path d="M382 255 L386 253" stroke="#190F0B" stroke-width="1.8" stroke-linecap="round" /> <!-- eyelash -->

      <!-- Rosy Blush Cheeks -->
      <ellipse cx="338" cy="268" rx="10" ry="6" fill="url(#blush)" />
      <ellipse cx="384" cy="268" rx="10" ry="6" fill="url(#blush)" />

      <!-- Cute Petite Nose -->
      <path d="M360 262 Q362 267 358 269" stroke="#DDA88E" stroke-width="1.8" stroke-linecap="round" fill="none" />

      <!-- Happy Sweet Smile -->
      <path d="M351 278 Q360 286 369 278" stroke="#B84458" stroke-width="2.5" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- ==================== JOINED HANDS & LOVE ENVELOPE ==================== -->
  <g id="sharedEnvelope" filter="url(#softShadow)">
    <!-- Hands holding envelope -->
    <ellipse cx="295" cy="432" rx="9" ry="7" fill="#FDE2D0" />
    <ellipse cx="320" cy="432" rx="8" ry="6.5" fill="#FDE2D0" />

    <!-- Pastel Pink Love Envelope -->
    <g transform="translate(290, 412)">
      <rect x="-24" y="-16" width="48" height="32" rx="3" fill="url(#envelopeGrad)" stroke="#C77D91" stroke-width="1.5" />
      <!-- Envelope Flap lines -->
      <path d="M-24 -16 L0 2 L24 -16" stroke="#C77D91" stroke-width="1.2" fill="none" />
      <path d="M-24 16 L-8 0" stroke="#E896A9" stroke-width="1" fill="none" />
      <path d="M24 16 L8 0" stroke="#E896A9" stroke-width="1" fill="none" />
      <!-- Golden Wax Heart Seal -->
      <circle cx="0" cy="2" r="6" fill="url(#goldGradient)" />
      <path d="M0 5 C-2 3 -4 1 -4 -1 C-4 -3 -2 -4 0 -2 C2 -4 4 -3 4 -1 C4 1 2 3 0 5 Z" fill="#C77D91" />
    </g>
  </g>

  <!-- ==================== BOTTOM DECORATIVE STAMP BANNER ==================== -->
  <g id="stampBanner" transform="translate(300, 520)">
    <!-- Parchment Ribbon -->
    <path d="M-170 -16 L170 -16 C180 -16 185 -10 185 0 C185 10 180 16 170 16 L-170 16 C-180 16 -185 10 -185 0 C-185 -10 -180 -16 -170 -16 Z" fill="#FFFDF9" stroke="#E8C987" stroke-width="2" />
    <!-- Mini postal scallop perforations on ribbon ends -->
    <circle cx="-185" cy="-8" r="3" fill="#F7DFD4" />
    <circle cx="-185" cy="0" r="3" fill="#F7DFD4" />
    <circle cx="-185" cy="8" r="3" fill="#F7DFD4" />
    <circle cx="185" cy="-8" r="3" fill="#F7DFD4" />
    <circle cx="185" cy="0" r="3" fill="#F7DFD4" />
    <circle cx="185" cy="8" r="3" fill="#F7DFD4" />

    <!-- Ribbon Handwritten Text -->
    <text x="0" y="5" font-family="'Caveat', cursive, sans-serif" font-size="20" font-weight="700" fill="#493447" text-anchor="middle" letter-spacing="1">
      you &amp; me &bull; my favorite little universe &hearts;
    </text>
  </g>

  <!-- Tiny Corner Scrapbook Accents -->
  <g stroke="#C77D91" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M70 110 C85 105 100 115 105 130" />
    <circle cx="106" cy="131" r="2" fill="#C77D91" />
    <path d="M530 110 C515 105 500 115 495 130" />
    <circle cx="494" cy="131" r="2" fill="#C77D91" />
  </g>
</svg>
