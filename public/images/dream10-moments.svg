<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="momentsBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="60%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FBF0E6"/>
    </radialGradient>
    <linearGradient id="polaroidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#FBF0E6"/>
    </linearGradient>
    <filter id="momentShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#493447" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Circle frame -->
  <g filter="url(#momentShadow)">
    <circle cx="250" cy="250" r="235" fill="url(#momentsBg)" stroke="#E8C987" stroke-width="3"/>
    <circle cx="250" cy="250" r="225" fill="none" stroke="#F5C6D0" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>

  <!-- Polaroid 1 (large center - couple cuddling) - slightly tilted left -->
  <g transform="rotate(-5, 250, 250)" filter="url(#momentShadow)">
    <rect x="162" y="130" width="176" height="192" rx="6" fill="url(#polaroidGrad)" stroke="#E8C987" stroke-width="2"/>
    <!-- Photo area in polaroid -->
    <rect x="172" y="140" width="156" height="140" rx="3" fill="#FAF2E9"/>
    <!-- Tiny caricature couple inside photo frame: cuddle pose -->
    <!-- Barath (left in photo) -->
    <ellipse cx="218" cy="192" rx="22" ry="24" fill="#E8B89A"/>
    <path d="M196 183 C195 164 206 156 218 156 C232 156 238 167 236 183 C232 174 225 171 218 173 C210 175 204 172 198 180 Z" fill="#1C1008"/>
    <rect x="204" y="187" width="13" height="9" rx="2" fill="none" stroke="#1C1008" stroke-width="2"/>
    <rect x="219" y="187" width="13" height="9" rx="2" fill="none" stroke="#1C1008" stroke-width="2"/>
    <line x1="217" y1="191" x2="219" y2="191" stroke="#1C1008" stroke-width="2"/>
    <path d="M210 202 Q218 208 226 202" stroke="#A0614A" stroke-width="2" fill="none"/>
    <ellipse cx="206" cy="204" rx="6" ry="4" fill="#E8A0A0" opacity="0.45"/>
    <ellipse cx="230" cy="204" rx="6" ry="4" fill="#E8A0A0" opacity="0.45"/>
    <!-- Pooja (right in photo, head on his shoulder) -->
    <ellipse cx="290" cy="196" rx="20" ry="22" fill="#DDA47E"/>
    <path d="M270 188 C268 168 278 160 290 160 C303 160 308 172 306 188 C302 178 295 175 290 178 C284 181 277 177 272 186 Z" fill="#0D0806"/>
    <path d="M268 188 C264 198 263 218 264 240 C267 238 268 220 269 202 Z" fill="#0D0806"/>
    <path d="M306 188 C310 198 311 218 310 240 C307 238 306 220 305 202 Z" fill="#0D0806"/>
    <path d="M278 200 Q290 206 300 200" stroke="#A05060" stroke-width="2" fill="none"/>
    <!-- Pooja's head tilted onto Barath's shoulder, eyes closed -->
    <path d="M276 194 Q282 190 288 194" stroke="#0D0806" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M292 194 Q298 190 304 194" stroke="#0D0806" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="280" cy="208" rx="6" ry="4" fill="#E8A0A0" opacity="0.45"/>
    <ellipse cx="300" cy="208" rx="6" ry="4" fill="#E8A0A0" opacity="0.45"/>
    <!-- Heart between them in photo -->
    <path d="M242 178 C242 174 245 172 248 174 C251 172 254 174 254 178 C254 183 248 186 248 186 S242 183 242 178 Z" fill="#C77D91"/>
    <!-- Photo caption area -->
    <text x="250" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#735D71" font-style="italic">forever &amp; always ♡</text>
  </g>

  <!-- Mini polaroid 2 top-left (tilted) - coffee mug polaroid -->
  <g transform="rotate(-12, 132, 170)" filter="url(#momentShadow)">
    <rect x="92" y="140" width="80" height="90" rx="4" fill="url(#polaroidGrad)" stroke="#F5C6D0" stroke-width="1.5"/>
    <rect x="98" y="146" width="68" height="60" rx="2" fill="#FAF2E9"/>
    <!-- Coffee mug scene -->
    <rect x="108" y="164" width="28" height="30" rx="4" fill="#F5C6D0" stroke="#C77D91" stroke-width="1.5"/>
    <path d="M136 172 C142 172 144 176 144 180 C144 184 141 186 136 186" stroke="#C77D91" stroke-width="2"/>
    <path d="M112 162 Q113 158 111 154" stroke="#AFA6E0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M118 162 Q119 158 117 154" stroke="#AFA6E0" stroke-width="1.5" stroke-linecap="round"/>
    <text x="132" y="220" text-anchor="middle" font-family="Georgia" font-size="8" fill="#735D71">lazy days ♡</text>
  </g>

  <!-- Mini polaroid 3 top-right - night sky -->
  <g transform="rotate(10, 380, 165)" filter="url(#momentShadow)">
    <rect x="332" y="130" width="80" height="90" rx="4" fill="#2F1E2E" stroke="#E8C987" stroke-width="1.5"/>
    <rect x="338" y="136" width="68" height="60" rx="2" fill="#1C1008"/>
    <!-- Stars in tiny sky -->
    <circle cx="352" cy="150" r="2" fill="#FFFDF9"/>
    <circle cx="368" cy="143" r="1.5" fill="#FFFDF9"/>
    <circle cx="390" cy="155" r="2" fill="#FFFDF9"/>
    <path d="M355 164 L356.5 160 L358 164 L362 165.5 L358 167 L356.5 171 L355 167 L351 165.5 Z" fill="#E8C987" transform="scale(0.7) translate(152,82)"/>
    <!-- Moon -->
    <path d="M394 148 C390 148 386 152 386 156 C386 160 390 164 394 164 C392 164 390 163 388 161 C384 157 384 151 388 148 C389 147 392 148 394 148 Z" fill="#E8C987" opacity="0.9"/>
    <text x="372" y="212" text-anchor="middle" font-family="Georgia" font-size="8" fill="#735D71">our midnight ♡</text>
  </g>

  <!-- Mini polaroid 4 bottom-left -->
  <g transform="rotate(8, 128, 360)" filter="url(#momentShadow)">
    <rect x="82" y="330" width="80" height="90" rx="4" fill="url(#polaroidGrad)" stroke="#E8C987" stroke-width="1.5"/>
    <rect x="88" y="336" width="68" height="60" rx="2" fill="#FFEAA7" opacity="0.8"/>
    <!-- Food / grocery bag scene -->
    <path d="M108 358 C108 348 116 344 130 344 C144 344 152 348 152 358 L148 386 L112 386 Z" fill="#E8C987" stroke="#C99E4B" stroke-width="1.5"/>
    <path d="M118 344 C118 338 122 334 130 334 C138 334 142 338 142 344" fill="none" stroke="#C99E4B" stroke-width="2"/>
    <!-- veggies/food sticking out -->
    <circle cx="122" cy="345" r="5" fill="#4A7C59"/>
    <circle cx="130" cy="342" r="6" fill="#FF6B6B"/>
    <circle cx="140" cy="344" r="5" fill="#E8C987"/>
    <text x="122" y="415" text-anchor="middle" font-family="Georgia" font-size="8" fill="#735D71">grocery runs ♡</text>
  </g>

  <!-- Mini polaroid 5 bottom-right -->
  <g transform="rotate(-6, 374, 355)" filter="url(#momentShadow)">
    <rect x="334" y="325" width="80" height="90" rx="4" fill="url(#polaroidGrad)" stroke="#F5C6D0" stroke-width="1.5"/>
    <rect x="340" y="331" width="68" height="60" rx="2" fill="#FAF2E9"/>
    <!-- Two faces laughing -->
    <ellipse cx="360" cy="358" rx="14" ry="15" fill="#E8B89A"/>
    <ellipse cx="388" cy="358" rx="13" ry="14" fill="#DDA47E"/>
    <!-- Glasses on left -->
    <rect x="351" y="353" width="9" height="6" rx="1.5" fill="none" stroke="#1C1008" stroke-width="1.5"/>
    <rect x="361" y="353" width="9" height="6" rx="1.5" fill="none" stroke="#1C1008" stroke-width="1.5"/>
    <!-- Both laughing big -->
    <path d="M353 364 Q360 370 367 364" stroke="#A0614A" stroke-width="2" fill="none"/>
    <path d="M380 364 Q388 370 396 364" stroke="#A05060" stroke-width="2" fill="none"/>
    <ellipse cx="354" cy="362" rx="5" ry="3" fill="#E8A0A0" opacity="0.5"/>
    <ellipse cx="366" cy="362" rx="5" ry="3" fill="#E8A0A0" opacity="0.5"/>
    <ellipse cx="382" cy="362" rx="5" ry="3" fill="#E8A0A0" opacity="0.5"/>
    <ellipse cx="394" cy="362" rx="5" ry="3" fill="#E8A0A0" opacity="0.5"/>
    <text x="374" y="410" text-anchor="middle" font-family="Georgia" font-size="8" fill="#735D71">our silly laughs ♡</text>
  </g>

  <!-- Big heart center-top overlay -->
  <path d="M234 108 C234 96 242 88 250 94 C258 88 266 96 266 108 C266 123 250 133 250 133 C250 133 234 123 234 108 Z" fill="#C77D91" filter="url(#momentShadow)"/>

  <!-- Caption ribbon -->
  <rect x="120" y="464" width="260" height="26" rx="13" fill="#C77D91" opacity="0.88"/>
  <text x="250" y="482" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" fill="#FFFDF9" font-style="italic">collecting our ordinary magic ♡</text>
</svg>
